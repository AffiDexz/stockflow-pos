# Render.com blueprint for the StockFlow POS backend.
# Create the service from this file, or configure manually with the commands below.
services:
  - type: web
    name: stockflow-pos-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false        # set to your cloud MySQL connection string
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false        # set to your deployed frontend URL
